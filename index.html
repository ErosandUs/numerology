    <title>Нумерология 10 Тел (YogaNUM)</title>

    <!-- 1. Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- 2. Мгновенно сообщаем Telegram, что приложение готово -->
    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
    </script>

    <!-- 3. АСИНХРОННОЕ (неблокирующее) подключение Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400&family=Montserrat:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400&family=Montserrat:wght@400;500;600;700&display=swap">
    </noscript>

    <!-- 4. Подключаем стили -->
    <link rel="stylesheet" href="numerology.css?v=3">
</head>
<body>

    <div class="num-app-container">
        <!-- Верхняя карточка ввода параметров -->
        <div class="num-input-group">
            <div class="num-field">
                <label for="userNameInput">Имя:</label>
                <input type="text" id="userNameInput" placeholder="Ваше имя">
            </div>
            <div class="num-field">
                <label for="userSurnameInput">Фамилия:</label>
                <input type="text" id="userSurnameInput" placeholder="Ваша фамилия">
            </div>
            <div class="num-field">
                <label for="birthDateInput">День рождения:</label>
                <input type="date" id="birthDateInput" value="1985-12-17">
            </div>
        </div>

        <button class="action-btn" id="calculateNumBtn">Рассчитать Карту Тел</button>

        <!-- Сетка 3x4 ярких плиток -->
        <div id="numerologyResult" style="display: none;">
            <!-- Плитки генерируются через JS -->
        </div>
    </div>

    <!-- Модальное окно для описания выбранного тела -->
    <div id="bodyDetailModal" class="num-modal">
        <div class="num-modal-content">
            <span class="num-modal-close" id="closeBodyModal">&times;</span>
            <h3 id="modalBodyTitle">Заголовок</h3>
            <span id="modalBodyArchetype" class="num-archetype-badge">Архетип</span>
            <div class="num-modal-body">
                <p id="modalBodyDesc">Описание тела...</p>
                <div class="num-modal-meta">
                    <p><strong>Качество:</strong> <span id="modalBodyQuality">-</span></p>
                    <p><strong>Стихия:</strong> <span id="modalBodyElement">-</span></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Основной скрипт приложения -->
    <script src="numerology.js?v=3"></script>
