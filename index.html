<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Нумерология 10 Тел (YogaNUM)</title>

    <!-- 1. Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- 2. Мгновенно сообщаем Telegram, что приложение готово -->
    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
    </script>

    <!-- 3. Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400&family=Montserrat:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400&family=Montserrat:wght@400;500;600;700;800&display=swap">
    </noscript>

    <!-- 4. Подключаем стили с новым параметром версии для сброса кеша -->
    <link rel="stylesheet" href="numerology.css?v=10">
</head>
<body>

    <div class="num-app-container">
        <!-- Верхняя карточка ввода: только День рождения -->
        <div class="num-input-group">
            <div class="num-field" id="openWheelBtn">
                <label>День рождения:</label>
                <div class="date-display" id="dateDisplay">11 августа 1999</div>
            </div>
        </div>

        <!-- Сетка 3x4 ярких плиток -->
        <div id="numerologyResult">
            <div class="num-grid-3x4" id="numTilesGrid">
                <!-- Плитки генерируются через JS -->
            </div>
        </div>
    </div>

    <!-- Собственный iOS-подобный барабан выбора даты (работает везде) -->
    <div id="wheelModal" class="num-modal">
        <div class="wheel-modal-content">
            <div class="wheel-header">
                <button type="button" class="wheel-btn cancel-btn" id="wheelCancelBtn">Отмена</button>
                <span class="wheel-title">День рождения</span>
                <button type="button" class="wheel-btn ensure-btn" id="wheelEnsureBtn">Готово</button>
            </div>
            <div class="wheel-container">
                <div class="wheel-highlight"></div>
                <div class="wheel-column" id="wheelDays"></div>
                <div class="wheel-column" id="wheelMonths"></div>
                <div class="wheel-column" id="wheelYears"></div>
            </div>
        </div>
    </div>

    <!-- Модальное окно для описания выбранного тела -->
    <div id="bodyDetailModal" class="num-modal">
        <div class="num-modal-content">
            <span class="num-modal-close" id="closeBodyModal">&times;</span>
            <h3 id="modalBodyTitle">Заголовок</h3>
            <span id="modalBodyArchetype" class="num-archetype-badge">Архетип</span>
            <div class="num-modal-body">
                <p id="modalBodyDesc">Описание тела...</p>
                <div class="num-modal-meta">
                    <p><strong>Качество:</strong> <span id="modalBodyQuality">-</span></p>
                    <p><strong>Стихия:</strong> <span id="modalBodyElement">-</span></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Основной скрипт с новым параметром версии -->
    <script src="numerology.js?v=10"></script>

    <!-- Yandex.Metrika counter -->
    <script type="text/javascript">
        (function(m,e,t,r,i,k,a){
            m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
            m[i].l=1*new Date();
            for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
            k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)
        })(window, document,'script','https://mc.yandex.ru/metrika/tag.js?id=110909428', 'ym');

        ym(110909428, 'init', {ssr:true, webvisor:true, clickmap:true, ecommerce:"dataLayer", referrer: document.referrer, url: location.href, accurateTrackBounce:true, trackLinks:true});
    </script>
    <noscript><div><img src="https://mc.yandex.ru/watch/110909428" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
    <!-- /Yandex.Metrika counter -->
</body>
</html>
